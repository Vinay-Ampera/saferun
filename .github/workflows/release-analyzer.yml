# Builds the SafeRun analyzer image, pushes it to ghcr.io and signs it with cosign (keyless, GitHub OIDC). Phase 5E.
#
# Triggered ONLY by pushing a tag `analyzer-v<number>[.<number>...]` whose commit is on main. The tag name is part of the signer
# identity that `saferun init` demands (saferun/sandbox/images.py: ANALYZER_SIGNER_IDENTITY_REGEXP), so a branch, a pull request or a
# renamed workflow produces a signature SafeRun refuses. The workflow prints the pushed manifest DIGEST: record it in
# ANALYZER_RELEASE (saferun/sandbox/images.py) in a reviewed commit; nothing updates the digest automatically.
#
# The image is built from the same recipe as docker/analyzer/build.sh (base image by digest, hash-locked Semgrep wheels,
# checksum-verified OSV-Scanner, rules checked against RULES_SHA256). tests/test_release_signature.py checks this file against images.py.
name: release-analyzer

on:
  push:
    tags: ["analyzer-v*"]

permissions:
  contents: read

concurrency:
  group: release-analyzer
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vinay-ampera/saferun-analyzer

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless cosign signing (GitHub OIDC token)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag name and that its commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^analyzer-v[0-9]+(\.[0-9]+)*$' || { echo "tag '$TAG' is not analyzer-v<number>[.<number>...]" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main" >&2; exit 1; }

      - name: Stage the build context (same files as docker/analyzer/build.sh)
        id: ctx
        run: |
          set -eu
          ctx="$RUNNER_TEMP/analyzer-ctx"
          mkdir "$ctx"
          cp docker/analyzer/Dockerfile docker/analyzer/fetch_verified.py docker/analyzer/semgrep-requirements.txt saferun/engine/rules/python.yml "$ctx/"
          echo "path=$ctx" >> "$GITHUB_OUTPUT"
          echo "rules_sha=$(sha256sum "$ctx/python.yml" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single linux/amd64 manifest, no provenance or SBOM index, so the digest is the image's own)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: ${{ steps.ctx.outputs.path }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: RULES_SHA256=${{ steps.ctx.outputs.rules_sha }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb  # v3.8.2
        with:
          cosign-release: v2.4.3

      - name: Sign the pushed digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "unexpected digest '$DIGEST'" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify with the exact identity expression SafeRun will use
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          regexp=$(python3 -c 'import re,sys; sys.path.insert(0,"."); from saferun.sandbox.images import ANALYZER_SIGNER_IDENTITY_REGEXP as r; print(r)')
          cosign verify \
            --certificate-identity-regexp "$regexp" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /dev/null

      - name: Print what to record in ANALYZER_RELEASE
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Analyzer image published and signed"
            echo
            echo "Record this in \`saferun/sandbox/images.py\` in a reviewed commit (rules must be unchanged since this tag):"
            echo
            echo '```python'
            echo "ANALYZER_RELEASE = AnalyzerRelease(ANALYZER_REGISTRY_REPOSITORY, \"$DIGEST\", \"$(date -u +%F)\")"
            echo '```'
            echo
            echo "Reference: \`$IMAGE@$DIGEST\` (tag \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\`)"
            echo "Check from any machine: \`saferun verify-images --signature\` (after recording it)."
          } >> "$GITHUB_STEP_SUMMARY"
