[project]
name = "saferun"
version = "0.0.1"
description = "Secure verification of AI-generated code"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
saferun = "saferun.cli:main"
saferun-web = "saferun.api.server:main"   # local dashboard; needs the `web` extra

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]   # httpx: FastAPI/Starlette TestClient
web = ["fastapi>=0.115,<0.141", "uvicorn"]   # upper bound = the range tested; it was originally forced by a conflict with a host-installed Semgrep, which SafeRun no longer uses
# no "analysis" extra: Semgrep and OSV-Scanner run only inside the analyzer container (docker/analyzer/build.sh), never from the host environment

[tool.setuptools.packages.find]
include = ["saferun*"]

[tool.setuptools.package-data]
saferun = ["engine/rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the sandbox image"]
