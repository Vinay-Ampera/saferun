[project]
name = "saferun"
version = "0.0.1"
description = "Secure verification of AI-generated code"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
saferun = "saferun.cli:main"
saferun-web = "saferun.api.server:main"   # local dashboard; needs the `web` extra

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]   # httpx: FastAPI/Starlette TestClient
web = ["fastapi>=0.115,<0.141", "uvicorn"]   # <0.141: later fastapi needs opentelemetry-api>=1.44, which conflicts with semgrep
analysis = ["semgrep"]   # Python static analysis; OSV-Scanner is a separate Go binary (not on PyPI)

[tool.setuptools.packages.find]
include = ["saferun*"]

[tool.setuptools.package-data]
saferun = ["engine/rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the sandbox image"]
