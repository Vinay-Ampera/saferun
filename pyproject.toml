[project]
name = "saferun"
version = "0.0.1"
description = "Secure verification of AI-generated code"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["semgrep"]   # Python static analysis; OSV-Scanner is a separate Go binary (not on PyPI)

[tool.setuptools.packages.find]
include = ["saferun*"]

[tool.setuptools.package-data]
saferun = ["engine/rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the sandbox image"]
